<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Colorful Homes | Admin sign in</title><link rel="stylesheet" href="/css/style.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:24px}.login{width:min(430px,100%);background:#e9e7df;padding:38px}.login h1{font:600 32px Manrope,sans-serif;letter-spacing:-.04em}.login p{font-size:13px;line-height:1.7;color:#707168}.login label{display:block;font-size:11px;font-weight:700;margin:20px 0 8px}.login input{width:100%;padding:14px;border:1px solid #c9c6bc;background:transparent}.login button{margin-top:20px;width:100%}#status{min-height:20px}</style></head><body><form class="login" id="login"><a class="brand" href="/"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><span class="brand-name">COLORFUL<span>HOMES</span><small>ADMINISTRATION</small></span></a><h1>Lead centre</h1><p>Sign in to view the latest contacts stored in the Colorful Homes HubSpot CRM.</p><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password" required><button class="button button-dark" type="submit">Sign in <span>↗</span></button><p id="status" role="status"></p></form><script>document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const s=document.getElementById('status');s.textContent='Signing in…';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Sign in failed');location.href='/admin/'}catch(err){s.textContent=err.message}})</script></body></html>
