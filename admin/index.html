<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Colorful Homes | Lead dashboard</title><link rel="stylesheet" href="/css/style.css"><style>.dash{max-width:1180px;margin:auto;padding:50px 6%}.dash-head{display:flex;justify-content:space-between;align-items:center;gap:20px}.dash h1{font:600 clamp(30px,5vw,48px) Manrope,sans-serif;letter-spacing:-.05em}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:35px 0}.stat{background:#e9e7df;padding:22px}.stat small{display:block;color:#77786f;font-size:10px;letter-spacing:.12em}.stat strong{display:block;font:700 30px Manrope;margin-top:10px}.table-wrap{overflow:auto;background:#fffefa}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:15px;border-bottom:1px solid #e5e2d9;font-size:12px}th{font-size:10px;letter-spacing:.1em;color:#77786f}.muted{color:#77786f;font-size:12px}#notice{padding:16px;background:#e9e7df;margin:20px 0;font-size:12px}.logout{border:1px solid #999;background:transparent;padding:12px 16px;font-size:11px;cursor:pointer}@media(max-width:650px){.stats{grid-template-columns:1fr}.dash{padding:35px 5%}.dash-head{align-items:flex-start;flex-direction:column}}</style></head><body><main class="dash"><div class="dash-head"><div><p class="eyebrow">COLORFUL HOMES • PRIVATE</p><h1>Lead dashboard</h1><p class="muted">Latest contacts from your HubSpot CRM.</p></div><button class="logout" id="logout">Sign out</button></div><div id="notice" role="status">Loading CRM contacts…</div><div class="stats"><div class="stat"><small>CONTACTS LOADED</small><strong id="count">—</strong></div><div class="stat"><small>WITH EMAIL</small><strong id="emails">—</strong></div><div class="stat"><small>COMPANIES IDENTIFIED</small><strong id="companies">—</strong></div></div><div class="table-wrap"><table><thead><tr><th>CONTACT</th><th>EMAIL</th><th>PHONE</th><th>COMPANY</th><th>LEAD STAGE</th><th>CREATED</th></tr></thead><tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody></table></div><p class="muted" id="foot"></p><p><a class="text-link" href="/">Return to website ↗</a></p></main><script>async function load(){const notice=document.getElementById('notice');try{const r=await fetch('/api/leads');const d=await r.json();if(r.status===401){location.href='/admin/login.html';return}if(!r.ok)throw new Error(d.error||'Unable to load contacts');const list=d.contacts||[];document.getElementById('count').textContent=d.totalReturned;document.getElementById('emails').textContent=list.filter(x=>x.email).length;document.getElementById('companies').textContent=new Set(list.map(x=>x.company).filter(Boolean)).size;document.getElementById('rows').innerHTML=list.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.email)+'</td><td>'+esc(x.phone)+'</td><td>'+esc(x.company)+'</td><td>'+esc(x.stage)+'</td><td>'+esc(x.created?new Date(x.created).toLocaleDateString():'')+'</td></tr>').join('')||'<tr><td colspan="6">No contacts returned.</td></tr>';document.getElementById('foot').textContent=d.note||'';notice.textContent='CRM connection active. Data is read directly from HubSpot.'}catch(e){notice.textContent=e.message;document.getElementById('rows').innerHTML='<tr><td colspan="6">Dashboard could not load CRM data.</td></tr>'}}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.getElementById('logout').addEventListener('click',async()=>{await fetch('/api/logout',{method:'POST'});location.href='/admin/login.html'});load();</script></body></html>
